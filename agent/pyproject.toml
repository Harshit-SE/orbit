[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-agent"
version = "0.2.0"
description = "Allowlisted Windows personal agent for Orbit"
requires-python = ">=3.11"
dependencies = ["websockets>=14,<16", "Pillow>=10,<13", "ddgs>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["orbit_agent*"]
